<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BLOG FCC</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var allowed = ['azul', 'morado', 'rojo', 'oscuro'];
      var saved = localStorage.getItem('blog_fcc_theme');
      document.documentElement.dataset.theme = allowed.indexOf(saved) >= 0 ? saved : 'azul';
    })();
  </script>
</head>

</body>
</html>
