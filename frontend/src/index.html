<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BLOG FCC</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var accents = ['azul', 'rojo', 'morado', 'verde', 'esmeralda', 'naranja'];
      var legacyAccent = { azul: 'azul', morado: 'morado', rojo: 'rojo', oscuro: 'azul' };
      var legacy = localStorage.getItem('blog_fcc_theme');
      var accent = localStorage.getItem('blog_fcc_accent');
      var mode = localStorage.getItem('blog_fcc_mode');
      if (accents.indexOf(accent) < 0) {
        accent = legacyAccent[legacy] || 'azul';
      }
      if (mode !== 'claro' && mode !== 'oscuro') {
        mode = legacy === 'oscuro' ? 'oscuro' : 'claro';
      }
      document.documentElement.dataset.accent = accent;
      document.documentElement.dataset.mode = mode;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
